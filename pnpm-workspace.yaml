packages:
  - packages/*
  - test/utils
  - test
  - .test-projects/*
  - demo
  - docs
allowBuilds:
  esbuild: true
  lightningcss: true
  workerd: true
  # Pulled in by Wrangler's image bindings, which the docs site does not use.
  sharp: false
minimumReleaseAgeExclude:
  # Our own packages are dogfooded from the registry; never gate them by release age.
  - '@pokit/*'
  - 'pokit'
